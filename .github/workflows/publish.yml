name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SteamAccountSwitcher.Launcher/SteamAccountSwitcher.Launcher.csproj

      - name: Publish Single-File Executable
        run: |
          dotnet publish SteamAccountSwitcher.Launcher/SteamAccountSwitcher.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ./release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SteamAccountSwitcher-Portable
          path: ./release/SteamAccountSwitcher.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/SteamAccountSwitcher.exe
          name: Steam Account Switcher Pro ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
